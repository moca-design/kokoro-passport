<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>心のパスポート｜旅のチケット</title>
  <meta name="description" content="旅のチケットで巡った国のスタンプを集める、あなただけの「心のパスポート」。" />
  <meta name="theme-color" content="#eaf2f7" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E🛂%3C/text%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;500;600&family=Noto+Sans+JP:wght@300;400;500&family=Cormorant+Garamond:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="app">

    <!-- 表紙（初回：名前入力）※既定で表示（JSが動かない時のフォールバック） -->
    <section class="screen cover" id="screen-cover">
      <img class="passport-cover" src="assets/cover.png"
           alt="心のパスポート ― HEART PASSPORT" />
      <form class="name-form" id="name-form">
        <label for="name-input">お名前（ニックネーム）を入れて、パスポートをひらきましょう</label>
        <input id="name-input" type="text" maxlength="16" autocomplete="off"
               placeholder="例：もか" required />
        <button type="submit" class="btn btn-primary">パスポートをひらく</button>
      </form>
    </section>

    <!-- パスポート本体（スタンプ帳） -->
    <section class="screen book" id="screen-book" hidden>
      <header class="book-head">
        <div class="book-emblem" aria-hidden="true">
          <svg viewBox="0 0 100 100"><use href="#crest" /></svg>
        </div>
        <p class="book-title">心のパスポート</p>
        <p class="book-owner">This passport belongs to <span id="owner-name"></span></p>
        <p class="book-progress"><span id="stamp-count">0</span> / 10 か国</p>
      </header>

      <div class="stamp-grid" id="stamp-grid" aria-label="スタンプ帳"></div>

      <footer class="book-foot">
        <a class="yt-promo" href="https://www.youtube.com/@mocasmusic_57" target="_blank" rel="noopener">
          <span class="yt-promo-ico" aria-hidden="true">♪</span>
          <span class="yt-promo-txt">
            <b>旅の余韻に、音楽を</b>
            moca's music room（YouTube）へ →
          </span>
        </a>
        <button class="link-reset" id="btn-reset">パスポートをリセット</button>
      </footer>
    </section>
  </main>

  <!-- 入国スタンプ／記録の モーダル -->
  <div class="modal" id="modal" hidden>
    <div class="modal-inner" role="dialog" aria-modal="true">
      <button class="modal-close" id="modal-close" aria-label="閉じる">×</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <!-- 共通の紋章（三つの王冠モチーフ） -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="crest" viewBox="0 0 100 100">
      <g fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round">
        <circle cx="50" cy="50" r="42" stroke-width="1.6" />
        <circle cx="50" cy="50" r="34" stroke-width="1" stroke-dasharray="1.6 3.4" />
      </g>
      <path fill="currentColor" transform="translate(50,48) rotate(-32) scale(2.05)"
        d="M0,-9 C1.7,-9 2.4,-5.5 2.4,-1.5 L8.5,3 8.5,5 2.4,3 2.4,7 4.6,9 4.6,10.4 0,9.2 -4.6,10.4 -4.6,9 -2.4,7 -2.4,3 -8.5,5 -8.5,3 -2.4,-1.5 C-2.4,-5.5 -1.7,-9 0,-9 Z" />
    </symbol>
  </svg>

  <script src="js/main.js"></script>
</body>
</html>
